---
# vSphere credentials: vault (vault_vsphere_user / vault_vsphere_password) or VSPHERE_USER / VSPHERE_PASSWORD.
# Sets platform_env (for OpenTofu, as TF_VAR_*: never on a command line) and the vsphere_* auth facts.
- name: vSphere credentials
  ansible.builtin.set_fact:
    vsphere_user: "{{ vault_vsphere_user | default(lookup('ansible.builtin.env', 'VSPHERE_USER')) }}"
    vsphere_password: "{{ vault_vsphere_password | default(lookup('ansible.builtin.env', 'VSPHERE_PASSWORD')) }}"
  no_log: true

- name: vSphere credentials are set
  ansible.builtin.assert:
    that: [vsphere_user | length > 0, vsphere_password | length > 0]
    fail_msg: "set vault_vsphere_user / vault_vsphere_password in clusters/vault.yml (or VSPHERE_USER / VSPHERE_PASSWORD)"
    quiet: true
  no_log: true

- name: OpenTofu environment for the vSphere provider
  ansible.builtin.set_fact:
    platform_env:
      TF_VAR_vsphere_user: "{{ vsphere_user }}"
      TF_VAR_vsphere_password: "{{ vsphere_password }}"
  no_log: true
