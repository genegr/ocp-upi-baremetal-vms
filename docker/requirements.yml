---
# Galaxy collections in the toolbox image. Pinned to the versions bundled with ansible 14.4.0 (2026-09-08).
collections:
  - name: community.general     # terraform module, dig lookup
    version: 13.4.0
  - name: community.vmware      # platform: vsphere (info modules, boot manager, screenshot)
    version: 6.3.0
  - name: vmware.vmware
    version: 2.10.0
  - name: kubernetes.core       # k8s, k8s_info, k8s_drain
    version: 6.5.0
  - name: community.docker      # infra: docker_compose_v2
    version: 5.3.0
  - name: community.crypto      # openssh_keypair
    version: 3.4.0
  - name: ansible.posix
    version: 2.2.2
  - name: ansible.windows       # WinRM connection, Windows facts (infra.dns.mode: ad)
    version: 3.8.0
  - name: community.windows     # win_dns_zone, win_dns_record (infra.dns.mode: ad)
    version: 3.3.0
  - name: everpure.flasharray   # FlashArray realm, pod, policy (purestorage.flasharray now redirects here)
    version: 1.45.1
  - name: vyos.vyos             # rhoso-on-ocp-upi's VyOS router: vyos_config, vyos_facts (network_cli)
    version: 6.2.0
  - name: ansible.netcommon     # network_cli connection for vyos.vyos
    version: 8.8.0              # 2026-11-12: an accepted exception to the 2-week rule (owner 2026-11-13)
  - name: ansible.utils         # ansible.netcommon dependency
    version: 6.1.1
  - name: everpure.flashblade   # FlashBlade S3 account, user, key, bucket (Portworx Backup target)
    version: 1.29.0             # 2026-10-30: the latest, an accepted exception to the 2-week rule (owner 2026-11-11)
