# VM migration from vSphere with MTV (playbooks/migration.yml; tags array, vsphere, mtv). Off by default.
# copy_offload: FlashArray XCOPY (needs storage.portworx on ISCSI or FC); the VMs to migrate go on a migration datastore
# whose volume lives in the cluster's realm pod. Plans are created and validated, never started by the playbook.
# migration:
#   enabled: true
#   source:
#     name: vcenter1                         # MTV Provider name
#     server: vcenter1.example.com
#     datacenter: dc1
#     sso_domain: vsphere.local              # the vCenter's SSO system domain (the MTV user is created there)
#     # admin_user_var / admin_password_var: vault variables of an SSO administrator (default vault_vsphere_*)
#     clone_hosts: [esx01.example.com, esx02.example.com]   # get MTV's SSH key; run the XCOPY clones
#   copy_offload:
#     host_access:                           # array-level objects that get access to the cluster's realm
#       hosts: [esx01-fc, esx02-fc]
#       host_groups: [esx-fc]
#     datastores:
#       - {name: mycluster-mtv-ds01, size: 1T, host_group: esx-fc, vsphere_cluster: cluster1,
#          format_host: esx01.example.com}
#     # storageclass: px-fa (FADA target); portworx_hook: true (enterprise mode) -> pxd_storageclass
#   network_map:
#     - {source: VM Network, destination: pod}          # or <namespace>/<network-attachment>
#   plans:
#     - {name: first-wave, vms: [vm1, vm2], target_namespace: migrated}

tools:
  tofu_version: 1.12.6
  coreos_installer_image: quay.io/coreos/coreos-installer:release
