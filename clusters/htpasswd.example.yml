---
# Copy to clusters/<cluster>.htpasswd.yml (gitignored) and run playbooks/users.yml (or set
# identity.htpasswd.enabled: true so the deploy does it). Keep passwords out of plain text: encrypt each one with
#   docker compose run --rm toolbox ansible-vault encrypt_string --vault-password-file .state/vault-pass 'the-password' --name password
#
# roles (optional), one entry per assignment:
#   - cluster-reader                                   ClusterRole, cluster-wide (ClusterRoleBinding)
#   - {role: admin, namespace: team-a}                 ClusterRole, only in that namespace (RoleBinding)
#   - {role: deployer, namespace: team-a, kind: Role}  the namespace's own Role (RoleBinding)
# cluster_role: X is shorthand for one cluster-wide role. Roles and namespaces must already exist.
# Bindings removed from this file are removed from the cluster on the next run.
htpasswd_users:
  - name: admin
    password: change-me
    cluster_role: cluster-admin
  - name: developer
    password: change-me
    roles:
      - {role: admin, namespace: team-a}
      - {role: view, namespace: team-b}
  - name: auditor
    password: change-me
    roles:
      - cluster-reader
      - {role: deployer, namespace: team-a, kind: Role}
  - name: guest
    password: change-me              # no roles: can log in and create their own projects

# Optional settings (defaults shown)
# htpasswd_idp_name: htpasswd          # name shown on the console login page
# htpasswd_secret_name: htpass-secret  # secret in openshift-config
# htpasswd_exclusive: true             # users missing from the list are removed
# htpasswd_prune_users: true           # ...with their User, Identity and OAuth tokens
# htpasswd_verify_login: true          # log every user in through the OAuth server
# htpasswd_validate_certs: false       # default ingress certificate is self-signed
# htpasswd_remove_kubeadmin: false     # delete the kubeadmin user (irreversible; needs a verified cluster-admin)
