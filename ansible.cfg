[defaults]
inventory = inventory/hosts.yml
roles_path = roles
library = plugins/modules
filter_plugins = plugins/filter
collections_path = /usr/share/ansible/collections
# Key for the infra (DNS/HAProxy) host, generated by the tools role.
private_key_file = .state/ssh/id_ed25519
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
local_tmp = .state/ansible/tmp

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = .state/ansible/cp
