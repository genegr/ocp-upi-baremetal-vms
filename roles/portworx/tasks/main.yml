---
# Portworx for FlashArray, pinned operator + image, using the cluster's dedicated realm user (flasharray_realm role).
#   mode csi:        PX-CSI only (FlashArray Direct Access); spec as install.portworx.com generates for oem=px-csi.
#   mode enterprise: Portworx Enterprise, storage pools on FlashArray cloud drives in the realm pod, plus the PX-CSI
#                    integration (portworx.io/pure-csi-integration) that serves the Direct Access volumes.
- name: Realm user token (from the flasharray phase)
  ansible.builtin.stat:
    path: "{{ cdir }}/flasharray-{{ fa.user }}.token"
  register: realm_token

- name: The realm user exists
  ansible.builtin.assert:
    that: realm_token.stat.exists or ansible_check_mode
    fail_msg: "no token for {{ fa.user }} in {{ cdir }}: run --tags flasharray first"
    quiet: true

- name: Portworx operator
  ansible.builtin.include_role:
    name: olm_operator
  vars:
    olm_namespace: "{{ px.namespace }}"
    olm_package: portworx-certified
    olm_channel: "{{ px.channel }}"
    olm_csv: "{{ px.operator_csv }}"
    olm_source: certified-operators

- name: FlashArray secret (realm user, never the array admin)
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: px-pure-secret
        namespace: "{{ px.namespace }}"
      type: Opaque
      stringData:
        # No Realm in array mode: PX-CSI then creates array-level node hosts.
        pure.json: >-
          {{ {'FlashArrays': [{'MgmtEndPoint': fa.endpoint,
                               'APIToken': lookup('ansible.builtin.file', cdir ~ '/flasharray-' ~ fa.user ~ '.token')}
                              | combine({'Realm': fa.realm} if fa.use_realm else {})]} | to_json }}
  no_log: true
  when: realm_token.stat.exists and (not ansible_check_mode or olm_csv_ready)

- name: StorageCluster (PX-CSI)
  kubernetes.core.k8s:
    definition:
      apiVersion: core.libopenstorage.org/v1
      kind: StorageCluster
      metadata:
        name: "px-{{ c.cluster.name }}"
        namespace: "{{ px.namespace }}"
        annotations:
          portworx.io/is-openshift: "true"
          portworx.io/misc-args: "--oem px-csi"
      spec:
        image: "{{ px.image }}"
        imagePullPolicy: IfNotPresent
        csi:
          enabled: true
        monitoring:
          telemetry:
            enabled: false
          prometheus:
            enabled: false
            exportMetrics: true
        env: "{{ px.env }}"
  when: px.mode == 'csi' and (not ansible_check_mode or olm_csv_ready)

- name: StorageCluster (Portworx Enterprise + PX-CSI integration)
  kubernetes.core.k8s:
    definition:
      apiVersion: core.libopenstorage.org/v1
      kind: StorageCluster
      metadata:
        name: "px-{{ c.cluster.name }}"
        namespace: "{{ px.namespace }}"
        annotations: >-
          {{ {'portworx.io/is-openshift': 'true', 'portworx.io/misc-args': ent.misc_args}
             | combine({'portworx.io/pure-csi-integration': 'true'} if ent.csi_integration else {}) }}
      spec:
        image: "{{ ent.image }}"
        imagePullPolicy: IfNotPresent
        kvdb:
          internal: true
          enableTLS: "{{ ent.kvdb_tls }}"
        certManager:
          enabled: "{{ ent.kvdb_tls }}"
        cloudStorage:
          provider: pure
          deviceSpecs: ["size={{ ent.cloud_drive_gib }},pod={{ fa.pod }}"]
          systemMetadataDeviceSpec: "size={{ ent.metadata_drive_gib }},pod={{ fa.pod }}"
        secretsProvider: k8s
        stork:
          enabled: true
        csi:
          enabled: true
          installSnapshotController: true
        monitoring:
          telemetry:
            enabled: "{{ ent.telemetry }}"
          prometheus:
            exportMetrics: true
        deleteStrategy:
          type: UninstallAndDelete
        env: "{{ px.env }}"
  vars:
    ent: "{{ px.enterprise }}"
  when: px.mode == 'enterprise' and (not ansible_check_mode or olm_csv_ready)

- name: StorageCluster running
  kubernetes.core.k8s_info:
    api_version: core.libopenstorage.org/v1
    kind: StorageCluster
    namespace: "{{ px.namespace }}"
    name: "px-{{ c.cluster.name }}"
  register: px_sc
  until: (px_sc.resources[0].status.phase | default('')) in ['Running', 'Online']
  retries: 90
  delay: 20
  when: not ansible_check_mode

- name: CSI driver registered on every storage node
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: CSINode
    name: "{{ item.hostname }}"
  register: csinode
  until: >-
    csinode.resources | length == 1
    and 'pxd.portworx.com' in (csinode.resources[0].spec.drivers | default([]) | map(attribute='name'))
  retries: 60
  delay: 10
  loop: "{{ storage_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

- name: Portworx Enterprise nodes, PX-CSI integration, license
  ansible.builtin.include_tasks: enterprise.yml
  when: px.mode == 'enterprise'

- name: StorageClass {{ px.storageclass.name }}
  kubernetes.core.k8s:
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ px.storageclass.name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: "{{ px.storageclass.default | bool | string | lower }}"
      provisioner: pxd.portworx.com
      parameters:
        backend: pure_block
        pure_fa_pod_name: "{{ fa.pod }}"
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      allowVolumeExpansion: true
