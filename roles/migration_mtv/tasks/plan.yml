---
# One MTV Plan: VMs by name, the maps of this source, the Portworx hook after each VM when plan.portworx_hook (else the
# disks stay on their FADA volumes). Static IPs are
# not preserved on the pod network (MTV warns the combination is unsupported). Validated here, started by hand.
- name: "Plan {{ plan.name }}"
  kubernetes.core.k8s:
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: Plan
      metadata: {name: "{{ plan.name }}", namespace: "{{ m.namespace }}"}
      spec:
        description: "{{ plan.description | default('ocp-upi migration plan') }}"
        type: "{{ plan.type }}"
        targetNamespace: "{{ plan.target_namespace }}"
        targetPowerState: "on"
        preserveStaticIPs: "{{ m.network_map | selectattr('destination', 'eq', 'pod') | list | length == 0 }}"
        provider:
          source: {name: "{{ src.name }}", namespace: "{{ m.namespace }}"}
          destination: {name: "{{ host_provider }}", namespace: "{{ m.namespace }}"}
        map:
          storage: {name: "{{ src.name }}-xcopy", namespace: "{{ m.namespace }}"}
          network: {name: "{{ src.name }}-net", namespace: "{{ m.namespace }}"}
        vms: "{{ plan.vms | map('community.general.dict_kv', 'name') | map('combine', vm_hooks) | list }}"
  vars:
    vm_hooks: "{{ {'hooks': [{'hook': {'name': 'fa-pxd-hook', 'namespace': m.namespace}, 'step': 'PostHook'}]}
                  if plan.portworx_hook else {} }}"

- name: "Plan {{ plan.name }} ready"
  kubernetes.core.k8s_info:
    api_version: forklift.konveyor.io/v1beta1
    kind: Plan
    namespace: "{{ m.namespace }}"
    name: "{{ plan.name }}"
  register: plan_info
  # Ready, or already done: after a migration MTV flags the plan VMAlreadyExists (the target VMs exist) / Succeeded.
  until: >-
    plan_info.resources | length == 1
    and (plan_info.resources[0] | k8s_condition('Ready') == 'True'
         or plan_info.resources[0] | k8s_condition('Succeeded') == 'True'
         or plan_info.resources[0] | k8s_condition('VMAlreadyExists') == 'True')
  retries: 18
  delay: 10
  when: not ansible_check_mode

- name: "Plan {{ plan.name }} state"
  ansible.builtin.debug:
    msg: >-
      {{ plan.name }}: {{ 'ready to start' if plan_info.resources[0] | k8s_condition('Ready') == 'True'
         else 'already migrated (its VMs exist in ' ~ plan.target_namespace ~ ')' }}
  when: not ansible_check_mode
