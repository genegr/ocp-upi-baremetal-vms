---
# One MTV Plan: VMs by name, the maps of this source, the Portworx hook after each VM when plan.portworx_hook (else the
# disks stay on their FADA volumes). Static IPs are
# not preserved on the pod network (MTV warns the combination is unsupported). Validated here, started by hand.
- name: "Plan {{ plan.name }}"
  kubernetes.core.k8s:
    definition:
      apiVersion: forklift.konveyor.io/v1beta1
      kind: Plan
      metadata: {name: "{{ plan.name }}", namespace: "{{ m.namespace }}"}
      spec:
        description: "{{ plan.description | default('ocp-upi migration plan') }}"
        type: "{{ plan.type }}"
        targetNamespace: "{{ plan.target_namespace }}"
        targetPowerState: "on"
        preserveStaticIPs: "{{ m.network_map | selectattr('destination', 'eq', 'pod') | list | length == 0 }}"
        provider:
          source: {name: "{{ src.name }}", namespace: "{{ m.namespace }}"}
          destination: {name: "{{ host_provider }}", namespace: "{{ m.namespace }}"}
        map:
          storage: {name: "{{ src.name }}-xcopy", namespace: "{{ m.namespace }}"}
          network: {name: "{{ src.name }}-net", namespace: "{{ m.namespace }}"}
        vms: "{{ plan.vms | map('community.general.dict_kv', 'name') | map('combine', vm_hooks) | list }}"
  vars:
    vm_hooks: "{{ {'hooks': [{'hook': {'name': 'fa-pxd-hook', 'namespace': m.namespace}, 'step': 'PostHook'}]}
                  if plan.portworx_hook else {} }}"

- name: "Plan {{ plan.name }} ready"
  kubernetes.core.k8s_info:
    api_version: forklift.konveyor.io/v1beta1
    kind: Plan
    namespace: "{{ m.namespace }}"
    name: "{{ plan.name }}"
  register: plan_info
  # Evaluated by MTV: Ready, or a run behind it (Succeeded / Failed), or a target VM that already exists
  # (VMAlreadyExists / MacConflicts: an earlier migration). The last two need a reset before the next run.
  until: >-
    plan_info.resources | length == 1
    and (plan_info.resources[0].status.conditions | default([]) | selectattr('status', 'eq', 'True')
         | map(attribute='type') | select('in', ['Ready', 'Succeeded', 'Failed', 'VMAlreadyExists', 'MacConflicts'])
         | list | length > 0)
  retries: 18
  delay: 10
  when: not ansible_check_mode

# Only a configuration problem fails the setup: a Critical condition other than the existing target VM.
- name: "Plan {{ plan.name }} state"
  ansible.builtin.assert:
    that: config_problems | length == 0
    fail_msg: "{{ plan.name }}: {{ config_problems }}"
    success_msg: >-
      {{ plan.name }}: {{ 'ready to start' if cond.Ready | default('') == 'True'
         else ('last run failed' if cond.Failed | default('') == 'True' else 'already migrated')
              ~ ' (target VM exists in ' ~ plan.target_namespace ~ '; run it again with -e reset=true)' }}
  vars:
    conds: "{{ plan_info.resources[0].status.conditions | default([]) }}"
    cond: "{{ dict(conds | map(attribute='type') | zip(conds | map(attribute='status'))) }}"
    config_problems: "{{ conds | selectattr('status', 'eq', 'True') | selectattr('category', 'eq', 'Critical')
                         | rejectattr('type', 'in', ['VMAlreadyExists', 'MacConflicts']) | map(attribute='message') | list }}"
  when: not ansible_check_mode
